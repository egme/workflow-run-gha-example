name: CI

on:
  workflow_run:
    workflows: ["Generate Files"]
    types:
      - completed

jobs:
  validate:
    runs-on: ubuntu-latest
    # Only run if the Generate Files workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      statuses: write
      contents: read

    steps:
      - name: Report CI status as pending
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'pending',
              target_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              description: 'Validating generated files...',
              context: 'CI / validate'
            })

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the branch that triggered the Generate Files workflow
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Validate MD5 checksums
        id: validate
        run: .github/scripts/validate-checksums.sh

      - name: Check source files correspondence
        run: .github/scripts/check-correspondence.sh

      - name: Generate Summary
        if: always()
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.validation_status }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: .github/scripts/ci-summary.sh

      - name: Report CI status as success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'success',
              target_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              description: 'All validations passed',
              context: 'CI / validate'
            })

      - name: Report CI status as failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'failure',
              target_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              description: 'Validation failed',
              context: 'CI / validate'
            })

