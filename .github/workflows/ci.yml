name: CI

on:
  workflow_run:
    workflows: ["Generate Files"]
    types:
      - completed

jobs:
  validate:
    runs-on: ubuntu-latest
    # Only run if the Generate Files workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the branch that triggered the Generate Files workflow
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Validate MD5 checksums
        id: validate
        run: |
          echo "🔍 Validating MD5 checksums in generated files..."
          
          validation_failed=0
          file_count=0
          
          # Check if generated directory exists
          if [ ! -d "generated" ]; then
            echo "❌ Error: 'generated' directory does not exist!"
            exit 1
          fi
          
          # Validate each file in generated directory
          for generated_file in generated/*.md; do
            if [ -f "$generated_file" ]; then
              file_count=$((file_count + 1))
              
              # Extract filename and hash from the generated file
              filename=$(basename "$generated_file")
              base_name=$(echo "$filename" | sed 's/_[a-f0-9]\{32\}\.md$//')
              hash_in_filename=$(echo "$filename" | grep -oP '_\K[a-f0-9]{32}(?=\.md$)')
              
              if [ -z "$hash_in_filename" ]; then
                echo "❌ Error: File '$filename' does not have a valid MD5 hash in its name"
                validation_failed=1
                continue
              fi
              
              # Calculate actual MD5 hash of the file content
              actual_hash=$(md5sum "$generated_file" | awk '{print $1}')
              
              # Compare hashes
              if [ "$hash_in_filename" = "$actual_hash" ]; then
                echo "✅ Valid: $filename (hash matches)"
              else
                echo "❌ Invalid: $filename"
                echo "   Expected hash: $hash_in_filename"
                echo "   Actual hash:   $actual_hash"
                validation_failed=1
              fi
            fi
          done
          
          echo ""
          echo "📊 Validation Summary:"
          echo "   Files validated: $file_count"
          
          if [ $validation_failed -eq 1 ]; then
            echo "   Status: ❌ FAILED"
            echo "validation_status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "   Status: ✅ PASSED"
            echo "validation_status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Check source files correspondence
        run: |
          echo ""
          echo "🔗 Checking correspondence between source and generated files..."
          
          correspondence_failed=0
          
          # Check that each source file has a corresponding generated file
          for source_file in sources/*.md; do
            if [ -f "$source_file" ]; then
              base_name=$(basename "$source_file" .md)
              md5_hash=$(md5sum "$source_file" | awk '{print $1}')
              expected_generated="generated/${base_name}_${md5_hash}.md"
              
              if [ -f "$expected_generated" ]; then
                echo "✅ Source '$source_file' has matching generated file"
              else
                echo "❌ Source '$source_file' is missing corresponding generated file: $expected_generated"
                correspondence_failed=1
              fi
            fi
          done
          
          # Check for orphaned generated files
          for generated_file in generated/*.md; do
            if [ -f "$generated_file" ]; then
              filename=$(basename "$generated_file")
              base_name=$(echo "$filename" | sed 's/_[a-f0-9]\{32\}\.md$//')
              source_file="sources/${base_name}.md"
              
              if [ ! -f "$source_file" ]; then
                echo "⚠️  Warning: Generated file '$filename' has no corresponding source file"
              fi
            fi
          done
          
          if [ $correspondence_failed -eq 1 ]; then
            echo ""
            echo "❌ Correspondence check failed"
            exit 1
          fi
          
          echo ""
          echo "✅ All correspondence checks passed"

      - name: Generate Summary
        if: always()
        run: |
          echo "### 🧪 CI Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.validate.outputs.validation_status }}" = "passed" ]; then
            echo "✅ **Status: PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "generated" ]; then
            for file in generated/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                hash=$(echo "$filename" | grep -oP '_\K[a-f0-9]{32}(?=\.md$)')
                echo "- \`$filename\` (MD5: \`${hash:0:8}...\`)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Triggered by workflow run: ${{ github.event.workflow_run.id }}*" >> $GITHUB_STEP_SUMMARY

