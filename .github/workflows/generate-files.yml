name: Generate Files

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'sources/**'
  push:
    branches:
      - main
    paths:
      - 'sources/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate files with MD5 hashes
        run: |
          echo "🔄 Generating files from sources..."
          
          # Create generated directory if it doesn't exist
          mkdir -p generated
          
          # Remove old generated files
          rm -f generated/*
          
          # Process each markdown file in sources
          for source_file in sources/*.md; do
            if [ -f "$source_file" ]; then
              # Get the base filename without extension
              base_name=$(basename "$source_file" .md)
              
              # Calculate MD5 hash of the file content
              md5_hash=$(md5sum "$source_file" | awk '{print $1}')
              
              # Create the generated filename with hash
              generated_file="generated/${base_name}_${md5_hash}.md"
              
              # Copy the source file to generated with the new name
              cp "$source_file" "$generated_file"
              
              echo "✅ Generated: $generated_file"
            fi
          done
          
          echo "📊 Generation complete!"

      - name: Check for changes
        id: check_changes
        run: |
          git diff --exit-code generated/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push generated files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add generated/
          git commit -m "🤖 Auto-generate files with MD5 hashes [skip ci]"
          git push

      - name: Summary
        run: |
          echo "### 📝 Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated files:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh generated/ | tail -n +2 | awk '{print "- " $9}' >> $GITHUB_STEP_SUMMARY || echo "No files generated" >> $GITHUB_STEP_SUMMARY

